name: Publish

on:
  push:
    tags: ['v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}

      - name: Setup cachix
        uses: cachix/cachix-action@v17
        with:
          name: yueyinqiu
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"

      - name: Build and push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          VERSION="${GITHUB_REF_NAME#v}"

          nix build .#nixos-in-podman-image --out-link result

          docker load < result
          echo "$GITHUB_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

          docker tag "nixos-in-podman:local" "ghcr.io/$GITHUB_REPOSITORY:latest"
          docker tag "nixos-in-podman:local" "ghcr.io/$GITHUB_REPOSITORY:$VERSION"

          docker push "ghcr.io/$GITHUB_REPOSITORY:latest"
          docker push "ghcr.io/$GITHUB_REPOSITORY:$VERSION"
