name: Publish

on:
  push:
    branches: [main]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}

      - name: Setup cachix
        uses: cachix/cachix-action@v17
        with:
          name: yueyinqiu
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"

      - name: Build and push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          nix build .#nixos-in-podman-image --out-link result

          nix profile install nixpkgs#skopeo

          VERSION="${GITHUB_SHA::7}"

          echo "$GITHUB_TOKEN" | skopeo login --username "$GITHUB_ACTOR" --password-stdin ghcr.io
          skopeo copy docker-archive:./result "docker://ghcr.io/$GITHUB_REPOSITORY:latest"
          skopeo copy docker-archive:./result "docker://ghcr.io/$GITHUB_REPOSITORY:$VERSION"
